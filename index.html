    <script>
        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1UT4XCg9_NTM1otqoqU8HhwI14l1ulWnO7WEDF8wN1sc/edit?usp=sharing";
        
        let wines = [];
        let beers = [];
        let spirits = [];

        let currentView = 'carta'; // 'carta', 'mescita', 'birre', 'superalcolici'
        let currentFilter = 'Tutti';
        let isLoadedCount = 0;
        const totalSheets = 3;

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function parsePrice(val) {
            if (val === undefined || val === null || val === '') return 0;
            if (typeof val === 'number') return val;
            let str = String(val).replace(',', '.').replace(/[^0-9.-]+/g, "");
            let num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        // Callback per la Carta dei Vini (gid=0 o default)
        window.googleDocCallback = function(data) {
            handleSheetResponse(data, 'wines');
        };

        // Callback per le Birre
        window.beerCallback = function(data) {
            handleSheetResponse(data, 'beers');
        };

        // Callback per i Superalcolici
        window.spiritCallback = function(data) {
            handleSheetResponse(data, 'spirits');
        };

        function handleSheetResponse(data, type) {
            isLoadedCount++;
            const statusEl = document.getElementById('status-loading');
            try {
                if (!data || !data.table || !data.table.rows) {
                    return;
                }
                const rows = data.table.rows;
                const cols = data.table.cols.map(c => c.label ? c.label.toLowerCase().trim() : '');

                if (type === 'wines') {
                    if (!cols.includes('nome')) return;
                    const validRows = rows.filter(row => row && row.c && row.c[cols.indexOf('nome')] && row.c[cols.indexOf('nome')].v);
                    wines = shuffleArray(validRows.map(row => {
                        const obj = {};
                        row.c.forEach((cell, i) => { if (cols[i]) obj[cols[i]] = cell ? cell.v : ''; });
                        const checkBool = (val) => val !== undefined && val !== null && String(val).toUpperCase().trim() === 'TRUE';
                        return {
                            cantina: obj.cantina ? String(obj.cantina).trim() : '',
                            nome: obj.nome ? String(obj.nome).trim() : '',
                            tipo: obj.tipo ? String(obj.tipo).toLowerCase().trim() : '',
                            regione: obj.regione ? String(obj.regione).trim() : '',
                            zona: obj.zona ? String(obj.zona).trim() : '',
                            uve: obj.uve ? String(obj.uve).trim() : '',
                            anno: obj.anno ? parseInt(obj.anno) : '',
                            prezzo: parsePrice(obj.prezzo),
                            prezzoBicchiere: parsePrice(obj.bicchiere),
                            disponibile: obj.disponibile !== undefined ? checkBool(obj.disponibile) : true,
                            doc: obj.doc ? String(obj.doc).trim() : '',
                            descrizione: obj.descrizione ? String(obj.descrizione).trim() : '',
                            sottotipo: obj.sottotipo ? String(obj.sottotipo).trim() : '',
                        };
                    }));
                } else if (type === 'beers') {
                    if (!cols.includes('nome')) return;
                    const validRows = rows.filter(row => row && row.c && row.c[cols.indexOf('nome')] && row.c[cols.indexOf('nome')].v);
                    beers = validRows.map(row => {
                        const obj = {};
                        row.c.forEach((cell, i) => { if (cols[i]) obj[cols[i]] = cell ? cell.v : ''; });
                        return {
                            birrificio: obj.birrificio ? String(obj.birrificio).trim() : '',
                            nome: obj.nome ? String(obj.nome).trim() : '',
                            tipologia: obj.tipologia ? String(obj.tipologia).trim() : '',
                            volume: obj.volume ? String(obj.volume).trim() : '',
                            alcol: obj.alcol ? String(obj.alcol).trim() : '',
                            prezzo: parsePrice(obj.prezzo),
                            descrizione: obj.descrizione ? String(obj.descrizione).trim() : ''
                        };
                    });
                } else if (type === 'spirits') {
                    if (!cols.includes('nome')) return;
                    const validRows = rows.filter(row => row && row.c && row.c[cols.indexOf('nome')] && row.c[cols.indexOf('nome')].v);
                    spirits = validRows.map(row => {
                        const obj = {};
                        row.c.forEach((cell, i) => { if (cols[i]) obj[cols[i]] = cell ? cell.v : ''; });
                        return {
                            categoria: obj.categoria ? String(obj.categoria).trim() : '',
                            nome: obj.nome ? String(obj.nome).trim() : '',
                            prezzo: parsePrice(obj.prezzo),
                            regione: obj.regione ? String(obj.regione).trim() : ''
                        };
                    });
                }

                if (isLoadedCount >= 1) {
                    statusEl.classList.add('hidden');
                    renderItems();
                }
            } catch (error) {
                console.error(error);
            }
        }

        function loadDataViaJSONP() {
            const statusEl = document.getElementById('status-loading');
            const matches = GOOGLE_SHEET_URL.match(/\/d\/([^/]+)/);
            if (!matches || !matches[1]) { 
                statusEl.innerText = "🔴 Errore: Link del foglio non valido."; 
                statusEl.classList.remove('hidden');
                return; 
            }
            
            const sheetId = matches[1];

            // 1. Carta Vini (Default / primo foglio)
            const script1 = document.createElement('script');
            script1.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:googleDocCallback&t=${Date.now()}`;
            document.body.appendChild(script1);

            // 2. Birre (sheet named Birre)
            const script2 = document.createElement('script');
            script2.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=Birre&tqx=responseHandler:beerCallback&t=${Date.now()}`;
            document.body.appendChild(script2);

            // 3. Superalcolici (sheet named Superalcolici)
            const script3 = document.createElement('script');
            script3.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=Superalcolici&tqx=responseHandler:spiritCallback&t=${Date.now()}`;
            document.body.appendChild(script3);
        }

        function switchView(view) {
            currentView = view;
            const tabCarta = document.getElementById('tab-carta');
            const tabMescita = document.getElementById('tab-mescita');
            const tabBirre = document.getElementById('tab-birre');
            const tabSuperalcolici = document.getElementById('tab-superalcolici');
            const filterSection = document.getElementById('filter-section');

            const activeTabClass = "px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition cursor-pointer bg-stone-950 text-white shadow-sm";
            const inactiveTabClass = "px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition cursor-pointer text-stone-950 hover:bg-stone-200";

            tabCarta.className = inactiveTabClass;
            tabMescita.className = inactiveTabClass;
            tabBirre.className = inactiveTabClass;
            tabSuperalcolici.className = inactiveTabClass;

            if (view === 'carta') {
                tabCarta.className = activeTabClass;
                filterSection.style.display = 'block';
                currentFilter = 'Tutti';
            } else if (view === 'mescita') {
                tabMescita.className = activeTabClass;
                filterSection.style.display = 'block';
                currentFilter = 'Tutti';
            } else if (view === 'birre') {
                tabBirre.className = activeTabClass;
                filterSection.style.display = 'none';
            } else if (view === 'superalcolici') {
                tabSuperalcolici.className = activeTabClass;
                filterSection.style.display = 'none';
            }
            renderItems();
        }

        function filterType(type, element) {
            currentFilter = type;
            updateButtonStyles(element);
            renderItems();
        }

        function updateButtonStyles(element) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-3 py-2 sm:py-1.5 bg-stone-100 text-stone-950 hover:bg-stone-200 rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-black/5 focus:outline-none cursor-pointer";
            });

            if (element) {
                element.className = "cat-btn px-3 py-2 sm:py-1.5 bg-stone-950 text-white rounded-full text-[11px] font-bold uppercase tracking-wider shadow-sm focus:outline-none cursor-pointer";
            }
        }

        function openModal(index, type) {
            let item;
            if (type === 'wine') {
                item = wines[index];
                if (!item) return;
                const docBadge = item.doc ? `<span class="text-[10px] font-sans font-bold tracking-wider bg-stone-800 text-stone-400 px-1.5 py-0.5 rounded border border-stone-700 ml-2 uppercase">${item.doc}</span>` : '';
                let labels = [];
                if (item.sottotipo) labels.push(item.sottotipo);
                if (currentView === 'mescita' || item.prezzoBicchiere > 0) labels.push('In Mescita');
                
                document.getElementById('modal-badge-container').innerHTML = labels.map(l => `<span class="text-[9px] font-medium px-2 py-0.5 rounded-full uppercase tracking-wider bg-stone-900 text-stone-300 border border-stone-800">${l}</span>`).join('') + docBadge;
                document.getElementById('modal-item-title').innerText = item.cantina;
                document.getElementById('modal-item-subtitle').innerHTML = `${item.nome} <span class="text-sm font-sans text-stone-500 ml-1 font-normal">${item.anno || ''}</span>`;
                document.getElementById('modal-item-extra').innerHTML = `🍇 Uve: <span class="text-stone-200 font-sans font-normal">${item.uve || 'N/D'}</span>`;
                document.getElementById('modal-item-geo').innerHTML = `📍 Denominazione: <b>${item.zona || 'N/D'}</b> &bull; Regione: <b>${item.regione || 'N/D'}</b>`;
                
                const isMescitaView = currentView === 'mescita';
                document.getElementById('modal-price-label').innerText = isMescitaView ? 'Prezzo Calice' : 'Prezzo Bottiglia';
                const activePrice = isMescitaView ? item.prezzoBicchiere : item.prezzo;
                document.getElementById('modal-item-price').innerText = `${activePrice ? activePrice.toFixed(2) : '0.00'} €`;
                
                const descBox = document.getElementById('modal-desc-box');
                if (item.descrizione && item.descrizione.length > 0) {
                    document.getElementById('modal-desc-title').innerText = "Nota di Degustazione";
                    document.getElementById('modal-item-desc').innerText = item.descrizione;
                    descBox.classList.remove('hidden');
                } else {
                    descBox.classList.add('hidden');
                }
            } else if (type === 'beer') {
                item = beers[index];
                if (!item) return;
                document.getElementById('modal-badge-container').innerHTML = `<span class="text-[9px] font-medium px-2 py-0.5 rounded-full uppercase tracking-wider bg-stone-900 text-stone-300 border border-stone-800">${item.tipologia || 'Birra'}</span>`;
                document.getElementById('modal-item-title').innerText = item.birrificio;
                document.getElementById('modal-item-subtitle').innerHTML = `${item.nome} <span class="text-sm font-sans text-stone-500 ml-1 font-normal">${item.volume || ''} &bull; ${item.alcol || ''}</span>`;
                document.getElementById('modal-item-extra').innerHTML = `🍺 Tipologia: <span class="text-stone-200 font-sans font-normal">${item.tipologia || 'N/D'}</span>`;
                document.getElementById('modal-item-geo').innerHTML = `📦 Formato: <b>${item.volume || 'N/D'}</b> &bull; Gradazione: <b>${item.alcol || 'N/D'}</b>`;
                document.getElementById('modal-price-label').innerText = 'Prezzo';
                document.getElementById('modal-item-price').innerText = `${item.prezzo ? item.prezzo.toFixed(2) : '0.00'} €`;

                const descBox = document.getElementById('modal-desc-box');
                if (item.descrizione && item.descrizione.length > 0) {
                    document.getElementById('modal-desc-title').innerText = "Descrizione Birra";
                    document.getElementById('modal-item-desc').innerText = item.descrizione;
                    descBox.classList.remove('hidden');
                } else {
                    descBox.classList.add('hidden');
                }
            } else if (type === 'spirit') {
                item = spirits[index];
                if (!item) return;
                document.getElementById('modal-badge-container').innerHTML = `<span class="text-[9px] font-medium px-2 py-0.5 rounded-full uppercase tracking-wider bg-stone-900 text-stone-300 border border-stone-800">${item.categoria || 'Superalcolico'}</span>`;
                document.getElementById('modal-item-title').innerText = item.nome;
                document.getElementById('modal-item-subtitle').innerHTML = `${item.categoria || ''}`;
                document.getElementById('modal-item-extra').innerHTML = `📍 Regione/Provenienza: <span class="text-stone-200 font-sans font-normal">${item.regione || 'N/D'}</span>`;
                document.getElementById('modal-item-geo').innerHTML = `📍 Provenienza: <b>${item.regione || 'N/D'}</b>`;
                document.getElementById('modal-price-label').innerText = 'Prezzo';
                document.getElementById('modal-item-price').innerText = `${item.prezzo ? item.prezzo.toFixed(2) : '0.00'} €`;
                document.getElementById('modal-desc-box').classList.add('hidden');
            }
            
            document.getElementById('item-modal').classList.replace('hidden', 'flex');
        }

        function closeModal() { document.getElementById('item-modal').classList.replace('flex', 'hidden'); }

        function renderItems() {
            const container = document.getElementById('item-list');
            container.innerHTML = '';

            if (currentView === 'birre') {
                if (beers.length === 0) {
                    container.innerHTML = `<p class="col-span-full text-center text-stone-900/60 py-12 italic text-sm">Nessuna birra disponibile o scheda 'Birre' non trovata.</p>`;
                    return;
                }
                beers.forEach((b, index) => {
                    const descBlock = b.descrizione && b.descrizione.length > 0 ? `<div class="mt-3 pt-2.5 border-t border-stone-200/60"><p class="serif-ananke text-sm text-stone-700 italic leading-relaxed">${b.descrizione}</p></div>` : '';
                    container.innerHTML += `
                        <div class="bg-white p-5 rounded-2xl border border-stone-700 shadow-xs flex flex-col justify-between transition duration-200 backdrop-blur-xs">
                            <div>
                                <div class="flex justify-between items-start gap-2">
                                    <span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider bg-amber-950 text-amber-100">${b.tipologia || 'Birra'}</span>
                                    <span class="text-stone-950 font-bold font-sans">${b.prezzo ? b.prezzo.toFixed(2) : '0.00'} €</span>
                                </div>
                                <h3 class="serif-ananke text-2xl text-stone-950 mt-3 font-medium leading-tight">${b.birrificio}</h3>
                                <p class="text-stone-900/80 text-base mt-0.5 font-semibold flex items-center flex-wrap">
                                    ${b.nome} <span class="text-xs font-sans text-stone-900/60 ml-2 font-normal">${b.volume || ''} &bull; ${b.alcol || ''}</span>
                                </p>
                                <p class="text-stone-900/70 text-xs mt-1.5 font-medium flex items-center gap-1">
                                    🍺 Tipologia: <span class="font-normal text-stone-900/90">${b.tipologia || 'N/D'}</span>
                                </p>
                                ${descBlock}
                            </div>
                        </div>
                    `;
                });
                return;
            }

            if (currentView === 'superalcolici') {
                if (spirits.length === 0) {
                    container.innerHTML = `<p class="col-span-full text-center text-stone-900/60 py-12 italic text-sm">Nessun superalcolico disponibile o scheda 'Superalcolici' non trovata.</p>`;
                    return;
                }
                spirits.forEach((s, index) => {
                    container.innerHTML += `
                        <div class="bg-white p-5 rounded-2xl border border-stone-700 shadow-xs flex flex-col justify-between transition duration-200 backdrop-blur-xs">
                            <div>
                                <div class="flex justify-between items-start gap-2">
                                    <span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider bg-stone-900 text-stone-200">${s.categoria || 'Superalcolico'}</span>
                                    <span class="text-stone-950 font-bold font-sans">${s.prezzo ? s.prezzo.toFixed(2) : '0.00'} €</span>
                                </div>
                                <h3 class="serif-ananke text-2xl text-stone-950 mt-3 font-medium leading-tight">${s.nome}</h3>
                                <p class="text-stone-900/80 text-base mt-0.5 font-semibold flex items-center flex-wrap">
                                    ${s.categoria || ''}
                                </p>
                                <p class="text-stone-900/60 text-xs mt-2 flex items-center gap-1 font-medium">📍 ${s.regione || 'N/D'}</p>
                            </div>
                        </div>
                    `;
                });
                return;
            }

            // Vista Vini (Carta o Mescita)
            let filtered = wines.map((w, index) => ({...w, originalIndex: index})).filter(w => {
                if (!w.disponibile) return false;
                if (currentView === 'mescita' && w.prezzoBicchiere <= 0) return false;

                let matchesFilter = false;
                const activeFilterLower = currentFilter.toLowerCase().trim();
                const wineTipoLower = w.tipo ? w.tipo.toLowerCase().trim() : '';
                
                if (activeFilterLower === 'tutti') { 
                    matchesFilter = true; 
                } else if (activeFilterLower === 'champagne') {
                    matchesFilter = w.champagne === true || wineTipoLower === 'champagne';
                } else { 
                    matchesFilter = wineTipoLower === activeFilterLower; 
                }

                return matchesFilter;
            });

            if (currentView === 'mescita') {
                const orderMap = {
                    'franciacorta': 1,
                    'altre bolle': 2,
                    'champagne': 3,
                    'bolle': 2,
                    'bianco': 4,
                    'rosso': 5,
                    'rosa': 6,
                    'arancione': 7
                };

                filtered.sort((a, b) => {
                    const typeA = a.tipo ? a.tipo.toLowerCase().trim() : '';
                    const typeB = b.tipo ? b.tipo.toLowerCase().trim() : '';
                    const orderA = orderMap[typeA] || 99;
                    const orderB = orderMap[typeB] || 99;
                    return orderA - orderB;
                });
            }

            if(filtered.length === 0) {
                const emptyMsg = currentView === 'mescita' 
                    ? "Nessun vino in mescita rispecchia i filtri selezionati." 
                    : "Nessun vino rispecchia i filtri selezionati.";
                container.innerHTML = `<p class="col-span-full text-center text-stone-900/60 py-12 italic text-sm">${emptyMsg}</p>`;
                return;
            }

            filtered.forEach(w => {
                let badgeLabel = w.sottotipo || 'Vino';
                let badgeColor = 'bg-stone-900 text-stone-200';
                const tipoCheck = w.sottotipo ? w.sottotipo.toLowerCase().trim() : '';

                if (tipoCheck === 'rosso') { badgeColor = 'bg-red-950 text-red-200'; }
                else if (tipoCheck === 'bianco') { badgeColor = 'bg-amber-950 text-amber-100'; }
                else if (tipoCheck === 'bolle') { badgeColor = 'bg-yellow-600 text-white font-bold'; }
                else if (tipoCheck === 'franciacorta') { badgeColor = 'bg-yellow-600 text-white font-bold'; }
                else if (tipoCheck === 'altre bolle') { badgeColor = 'bg-zinc-800 text-yellow-100'; }
                else if (tipoCheck === 'arancione') { badgeColor = 'bg-orange-800 text-orange-100'; }
                else if (tipoCheck === 'rosa') { badgeColor = 'bg-pink-800 text-pink-100'; }

                const docBadge = w.doc ? `<span class="text-[10px] font-sans font-bold tracking-wider bg-black/10 text-stone-900 px-1.5 py-0.5 rounded border border-black/10 ml-2 uppercase">${w.doc}</span>` : '';
                const geoString = w.zona ? `${w.zona} &bull; ${w.regione}` : w.regione;
                const displayPrice = currentView === 'mescita' ? w.prezzoBicchiere : w.prezzo;
                const priceLabelSuffix = currentView === 'mescita' ? ' € <span class="text-[11px] font-medium text-stone-700">calice</span>' : ' €';
                
                const descBlock = w.descrizione && w.descrizione.length > 0 ? `<div class="mt-3 pt-2.5 border-t border-stone-200/60"><p class="serif-ananke text-sm text-stone-700 italic leading-relaxed">${w.descrizione}</p></div>` : '';

                container.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl border border-stone-700 shadow-xs flex flex-col justify-between transition duration-200 backdrop-blur-xs">
                        <div>
                            <div class="flex justify-between items-start gap-2">
                                <span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider ${badgeColor}">${badgeLabel}</span>
                                <span class="text-stone-950 font-bold font-sans">${displayPrice ? displayPrice.toFixed(2) : '0.00'}${priceLabelSuffix}</span>
                            </div>
                            
                            <h3 class="serif-ananke text-2xl text-stone-950 mt-3 font-medium leading-tight">
                                ${w.cantina}
                            </h3>
                            
                            <p class="text-stone-900/80 text-base mt-0.5 font-semibold flex items-center flex-wrap">
                                ${w.nome} 
                                <span class="text-xs font-sans text-stone-900/60 ml-2 font-normal">${w.anno || ''}</span>
                                ${docBadge}
                            </p>
                            
                            <p class="text-stone-900/70 text-xs mt-1.5 font-medium flex items-center gap-1">
                                🍇 Uve: <span class="font-normal text-stone-900/90">${w.uve || 'N/D'}</span>
                            </p>
                            
                            <p class="text-stone-900/60 text-xs mt-2 flex items-center gap-1 font-medium">📍 ${geoString}</p>
                            
                            ${descBlock}
                        </div>
                    </div>
                `;
            });
        }

        
    
        loadDataViaJSONP();

    <style>
        @keyframes slotScroll {
            0% { transform: translateY(0); opacity: 0.5; }
            50% { opacity: 1; }
            100% { transform: translateY(-20px); opacity: 0.5; }
        }
        .slot-scrolling {
            animation: slotScroll 0.1s linear infinite;
        }
        @keyframes wheelSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(360deg) scale(1.2); }
            100% { transform: rotate(720deg) scale(1); }
        }
        .spinning-wheel {
            animation: wheelSpin 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
    <script>
        function spinWheelAndFilter(element) {
            // First call normal filter for Tutti
            filterType('Tutti', element);

            // Play audio
            const audio = document.getElementById('fortune-audio');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio play blocked:", e));
            }

            // Wheel image spin animation
            const wheelImg = document.getElementById('tutti-wheel-img');
            if (wheelImg) {
                wheelImg.classList.remove('spinning-wheel');
                void wheelImg.offsetWidth; // trigger reflow
                wheelImg.classList.add('spinning-wheel');
            }

            // Visual effect: rapid scrolling / shuffling or highlighting cards
            const container = document.getElementById('item-list');
            if (!container) return;

            container.classList.add('slot-scrolling');

            // Simulate the wheel of fortune spinning through items
            let counter = 0;
            const maxSpins = 25;
            const intervalTime = 60;

            const spinInterval = setInterval(() => {
                counter++;
                // Shuffle visually or re-render random slice
                if (wines.length > 0) {
                    wines = shuffleArray(wines);
                    renderItems();
                }

                if (counter >= maxSpins) {
                    clearInterval(spinInterval);
                    container.classList.remove('slot-scrolling');

                    // Stop audio after animation if needed or let it finish
                    // Pick a random wine and open its modal!
                    if (wines.length > 0) {
                        const randomIndex = Math.floor(Math.random() * wines.length);
                        // Scroll to top smoothly
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        // Open modal for the winning wine
                        setTimeout(() => {
                            openModal(randomIndex, 'wine');
                        }, 300);
                    }
                }
            }, intervalTime);
        }
    </script>
